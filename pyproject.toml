[project]
name = "foodstuff-app"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.0,<5.3",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-cors-headers>=4.4",
  "python-dotenv>=1.0",
  "whitenoise>=6.7",
  "PyMySQL[rsa]>=1.1",
  "psycopg[binary]>=3.2",
]

[tool.vercel]
entrypoint = "wsgi:application"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build && python backend/manage.py collectstatic --noinput"
